<div style="padding: 50px; font-family: sans-serif;">
  <h1>Prueba de Conexión WishDish 🚀</h1>

  <div style="margin-bottom: 20px;">
    <input
      type="text"
      [(ngModel)]="nuevoNombre"
      placeholder="Escribe tu nombre..."
      style="padding: 10px; font-size: 16px;">

    <button
      (click)="guardarNombre()"
      style="padding: 10px 20px; font-size: 16px; margin-left: 10px; cursor: pointer;">
      Guardar
    </button>
  </div>

  <h2>Usuarios Registrados en MySQL:</h2>
  <ul>
    <li *ngFor="let usuario of nombres" style="font-size: 18px; margin-bottom: 5px;">
      ID: <strong>{{ usuario.id }}</strong> - Nombre: <strong>{{ usuario.nombre }}</strong>
    </li>
  </ul>

  <p *ngIf="nombres.length === 0" style="color: gray;">Aún no hay usuarios en la base de datos.</p>
</div>
