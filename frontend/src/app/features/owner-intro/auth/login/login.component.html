<div style="max-width: 400px; margin: 80px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: sans-serif; background-color: white;">

  <h2 style="text-align: center; color: #333; margin-bottom: 25px;">
    {{ isRegistering ? 'Registrar WishDish' : 'Iniciar Sesión' }}
  </h2>

  <div *ngIf="errorMessage" style="background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px;">
    {{ errorMessage }}
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 5px; color: #555; font-size: 14px; font-weight: bold;">Correo Electrónico:</label>
    <input
      type="email"
      [(ngModel)]="email"
      placeholder="admin@restaurante.com"
      style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px;">
  </div>

  <div style="margin-bottom: 25px;">
    <label style="display: block; margin-bottom: 5px; color: #555; font-size: 14px; font-weight: bold;">Contraseña:</label>
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Mínimo 6 caracteres"
      style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px;">
  </div>

  <button
    (click)="onSubmit()"
    style="width: 100%; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.3s;">
    {{ isRegistering ? 'Crear Cuenta' : 'Entrar' }}
  </button>

  <p
    style="text-align: center; margin-top: 20px; cursor: pointer; color: #2563eb; font-size: 14px;"
    (click)="isRegistering = !isRegistering; errorMessage = ''">
    {{ isRegistering ? '¿Ya tienes cuenta? Inicia sesión' : '¿Primer acceso? Registra tu restaurante' }}
  </p>

</div>
