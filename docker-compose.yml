services:
  # 1. BASE DE DATOS
  mysql-db:
    image: mysql:8.0
    container_name: wishdish_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wishdish_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. BACKEND (Spring Boot)
  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: wishdish_backend
    working_dir: /app
    volumes:
      - ./backend:/app:z
      - maven_cache:/root/.m2:z
    ports:
      - "8080:8080"
    command: mvn clean spring-boot:run
    depends_on:
      - mysql-db

  # 3. FRONTEND (Angular)
  frontend:
    image: node:20
    container_name: wishdish_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules   # ← NUEVO: aísla node_modules en Linux
    ports:
      - "4200:4200"
    command: /bin/sh -c "rm -rf .angular/cache && npm install && npx ng serve --host 0.0.0.0 --poll 1000"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wishdish_phpmyadmin
    environment:
      PMA_HOST: mysql-db # Le decimos que se conecte al contenedor de tu base de datos
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80" # Mapeamos el puerto 80 del contenedor al 8081 de tu PC
    depends_on:
      - mysql-db

volumes:
  mysql_data:
  maven_cache:
  frontend_node_modules:   # ← NUEVO: volumen Docker nativo para node_modules