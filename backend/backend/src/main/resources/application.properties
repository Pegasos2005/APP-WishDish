# v ================================================= CONECTA EL BACK A LA DB ======================================= v
# Conexión a la base de datos de Docker
spring.datasource.url=jdbc:mysql://localhost:3306/wishdish_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate (El motor que traduce Java a SQL)
# 'update' crea las tablas automáticamente si no existen basadas en tu código Java
spring.jpa.hibernate.ddl-auto=update

# Opcional: Muestra en la consola de IntelliJ las consultas SQL que se ejecutan
spring.jpa.show-sql=true
# ^ ================================================================================================================= ^